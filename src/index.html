<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>2048 Game</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body>
    <main class="container">
      <header class="game-header">
        <h1>2048</h1>

        <div class="info">
          <span>Score</span>
          <output class="game-score"></output>
        </div>

        <button
          id="start-btn"
          class="button start"
          type="button"
        >
          Start
        </button>
      </header>

      <div
        id="status-message"
        class="message hidden"
      ></div>

      <div
        id="board"
        class="board"
      ></div>
    </main>

    <script
      type="module"
      src="./scripts/main.js"
    ></script>
  </body>
</html>
